main:
  - title: "CDMD: A Cross-Dataset Mixed-Type Diffusion Model for Tabular Data"
    authors: "<strong>Mohamed Amine Ketata</strong>, Maximilian Schambach, Stephan Günnemann"
    conference: "Preprint, 2026 (under review)."
    notes: "Accepted at the BeNTo Workshop at NeurIPS 2026."
    summary: >-
      A shared diffusion model for mixed-type tabular data across heterogeneous
      datasets, with pretraining on 337 datasets to improve generation with
      limited target data.
    pdf: https://arxiv.org/abs/2609.39124

  - title: "Joint Relational Database Generation via Graph-Conditional Diffusion Models"
    authors: "<strong>Mohamed Amine Ketata</strong>, David Lüdke, Leo Schwinn, Stephan Günnemann"
    conference: "<strong>NeurIPS 2025</strong>"
    summary: >-
      GRDM generates relational databases non-autoregressively by jointly
      denoising connected rows with a graph neural network.
    pdf: https://proceedings.neurips.cc/paper_files/paper/2025/hash/ef7f818e234b3d81ad13ea0430353415-Abstract-Conference.html
    code: https://github.com/ketatam/rdb-diffusion

  - title: "Lift Your Molecules: Molecular Graph Generation in Latent Euclidean Space"
    authors: "<strong>Mohamed Amine Ketata*</strong>, Nicholas Gao*, Johanna Sommer*, Tom Wollschläger, Stephan Günnemann"
    conference: "<strong>ICLR 2025</strong>"
    notes: "Oral presentation and Best Paper Runner-up at the GRaM Workshop at ICML 2024."
    summary: >-
      SyCo generates molecular graphs through equivariant diffusion in a
      synthetic 3D latent space.
    pdf: https://proceedings.iclr.cc/paper_files/paper/2025/hash/2af641762dc02035c31a9314b2d090b6-Abstract-Conference.html
    talk: https://icml.cc/virtual/2024/39289

  - title: "Uncertainty Estimation for Molecules: Desiderata and Methods"
    authors: "Tom Wollschläger, Nicholas Gao, Bertrand Charpentier, <strong>Mohamed Amine Ketata</strong>, Stephan Günnemann"
    conference: "<strong>ICML 2023</strong>"
    summary: >-
      A study of what uncertainty estimates should capture in molecular
      prediction and how existing methods compare.
    pdf: https://proceedings.mlr.press/v202/wollschlager23a.html
    code: https://github.com/wollschlager/uncertainty_for_molecules

  - title: "DiffDock-PP: Rigid Protein-Protein Docking with Diffusion Models"
    authors: "<strong>Mohamed Amine Ketata*</strong>, Cedrik Laue*, Ruslan Mammadov*, Hannes Stärk, Menghua Wu, Gabriele Corso, Céline Marquet, Regina Barzilay, Tommi S. Jaakkola"
    conference: "Machine Learning for Drug Discovery Workshop at <strong>ICLR 2023</strong>"
    summary: >-
      Rigid protein-protein docking through diffusion over relative rotations
      and translations.
    pdf: https://arxiv.org/abs/2304.03889
    code: https://github.com/ketatam/DiffDock-PP